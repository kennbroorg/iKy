##############################################################################
# nginx.conf — iKy new-frontend
#
# Serves the Angular SPA (pre-built, extracted from a GitHub Release asset).
# Proxies /api/* → backend:5000 (strips /api prefix to match pathRewrite
# behavior of the Angular dev proxy — /api/search → backend:5000/search).
# Proxies /socket.io/* → backend:5000 with WebSocket upgrade.
##############################################################################

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"             always;
    add_header X-Content-Type-Options "nosniff"                always;
    add_header X-XSS-Protection       "1; mode=block"          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # Gzip compression
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ------------------------------------------------------------------
    # SPA fallback — Angular handles client-side routing
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # API reverse proxy
    # Strip /api prefix: /api/search → http://backend:5000/search
    # This replicates the Angular dev-server pathRewrite behavior:
    #   pathRewrite: { "^/api": "" }
    # ------------------------------------------------------------------
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ------------------------------------------------------------------
    # Socket.io — WebSocket upgrade
    # ------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  "upgrade";
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ------------------------------------------------------------------
    # Static asset caching — Angular hashes filenames for cache-busting
    # so 1-year expiry is safe for JS/CSS/fonts/images
    # ------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # Health-check endpoint (used by Docker HEALTHCHECK)
    # ------------------------------------------------------------------
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
